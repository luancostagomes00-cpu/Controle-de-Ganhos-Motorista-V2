<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Controle de Ganhos Para Motorista de Aplicativo</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><style>:root{--bg:#0f172a;--card:rgba(255,255,255,.08);--text:#fff;--accent:#3b82f6}*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI}body{background:linear-gradient(135deg,#020617,#0f172a);color:var(--text)}.app{display:flex;min-height:100vh}.side{width:280px;padding:24px;background:rgba(255,255,255,.05);backdrop-filter:blur(20px);border-right:1px solid rgba(255,255,255,.1)}.logo{font-size:24px;font-weight:700;margin-bottom:24px}.side button{width:100%;padding:14px;margin:6px 0;border:none;border-radius:14px;background:#1e293b;color:#fff;text-align:left}.main{flex:1;padding:24px}.hero,.card{background:var(--card);backdrop-filter:blur(18px);border-radius:24px;padding:20px}.hero{margin-bottom:20px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.value{font-size:32px;font-weight:700}.page{display:none}.active{display:block}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}input,select{width:100%;padding:12px;margin:8px 0;border-radius:12px;border:none}.btn{background:var(--accent);color:#fff;padding:12px;border:none;border-radius:12px}.progress{height:16px;background:#334155;border-radius:20px}.bar{height:100%;width:0;background:linear-gradient(90deg,#22c55e,#3b82f6)}table{width:100%;border-collapse:collapse}td,th{padding:12px;border-bottom:1px solid rgba(255,255,255,.1)}@media(max-width:900px){.app{flex-direction:column}.side{width:100%}.grid2{grid-template-columns:1fr}}</style></head><body><div class=app><aside class=side><div class=logo>🚗 Controle de Ganhos Para Motorista de Aplicativo</div><button onclick="openPg('dash')"><i class='fa fa-chart-line'></i> Dashboard</button><button onclick="openPg('lan')"><i class='fa fa-plus-circle'></i> Lançamentos</button><button onclick="openPg('hist')"><i class='fa fa-clock'></i> Histórico</button></aside><main class=main><section id=dash class='page active'><div class=hero><h2>Dashboard Executivo</h2><p>Acompanhe ganhos, gastos e desempenho.</p></div><div class=cards><div class=card><div>Ganhos</div><div id=g class=value>R$0</div></div><div class=card><div>Gastos</div><div id=s class=value>R$0</div></div><div class=card><div>Lucro</div><div id=l class=value>R$0</div></div><div class=card><div>Meta diária R$100</div><div class=progress><div id=bar class=bar></div></div></div></div><div class=grid2><div class=card><h3>🚕 Uber x 99 x InDrive</h3><canvas id=c1></canvas></div><div class=card><h3>📅 Ganhos por Mês</h3><canvas id=c2></canvas></div></div></section><section id=lan class=page><div class=grid2><div class=card><h3>💰 Novo Ganho</h3><input id=ganho type=number placeholder='Valor'><select id=plat><option>Uber</option><option>99</option><option>InDrive</option></select><button class=btn onclick='addG()'>Salvar Ganho</button></div><div class=card><h3>💸 Novo Gasto</h3><input id=gasto type=number placeholder='Valor'><button class=btn onclick='addS()'>Salvar Gasto</button></div></div><div class='card' style='margin-top:18px'><h3>⛽ Abastecimento</h3><input id=litros placeholder='Litros'><input id=km placeholder='KM Rodados'><button class=btn onclick='calc()'>Calcular Km/L</button><p id=kml></p></div></section><section id=hist class=page><div class=card><h3>📋 Histórico</h3><table><thead><tr><th>Data</th><th>Tipo</th><th>Valor</th><th>Plataforma</th></tr></thead><tbody id=tb></tbody></table></div></section></main></div><script>let db=JSON.parse(localStorage.getItem('driver_fin')||'{"mov":[]}');function openPg(i){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(i).classList.add('active')}function save(){localStorage.setItem('driver_fin',JSON.stringify(db));render()}function addG(){db.mov.push({d:new Date().toLocaleDateString('pt-BR'),t:'Ganho',v:+ganho.value,p:plat.value});save()}function addS(){db.mov.push({d:new Date().toLocaleDateString('pt-BR'),t:'Gasto',v:+gasto.value,p:'-'});save()}function calc(){kml.innerHTML='Consumo: '+(+km.value/+litros.value).toFixed(2)+' km/L'}function render(){let ga=db.mov.filter(x=>x.t=='Ganho').reduce((a,b)=>a+b.v,0),gs=db.mov.filter(x=>x.t=='Gasto').reduce((a,b)=>a+b.v,0);g.innerHTML='R$ '+ga.toFixed(2);s.innerHTML='R$ '+gs.toFixed(2);l.innerHTML='R$ '+(ga-gs).toFixed(2);bar.style.width=Math.min(ga,100)+'%';tb.innerHTML=db.mov.map(x=>`<tr><td>${x.d}</td><td>${x.t}</td><td>R$ ${x.v.toFixed(2)}</td><td>${x.p}</td></tr>`).join('');let u=0,n=0,i=0;db.mov.filter(x=>x.t=='Ganho').forEach(x=>{if(x.p=='Uber')u+=x.v;else if(x.p=='99')n+=x.v;else i+=x.v});if(window.ch1)ch1.destroy();ch1=new Chart(c1,{type:'doughnut',data:{labels:['Uber','99','InDrive'],datasets:[{data:[u,n,i]}]}});let meses=new Array(12).fill(0);db.mov.filter(x=>x.t=='Ganho').forEach(x=>{let m=parseInt(x.d.split('/')[1])-1; if(m>=0)meses[m]+=x.v});if(window.ch2)ch2.destroy();ch2=new Chart(c2,{type:'line',data:{labels:['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'],datasets:[{label:'Ganhos Mensais',data:meses,borderColor:'#22c55e',fill:true}]}})}render();</script></body></html>
