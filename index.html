<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controle de Ganhos Para Motorista de Aplicativo</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
background:#0f172a;
color:white;
}

.container{
display:flex;
min-height:100vh;
}

.sidebar{
width:260px;
background:rgba(255,255,255,.05);
backdrop-filter:blur(20px);
padding:20px;
}

.logo{
font-size:22px;
font-weight:700;
margin-bottom:25px;
line-height:1.4;
}

.menu button{
width:100%;
padding:14px;
margin-bottom:10px;
border:none;
border-radius:12px;
background:#1e293b;
color:white;
cursor:pointer;
}

.content{
flex:1;
padding:25px;
}

.page{
display:none;
}

.page.active{
display:block;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
margin-bottom:20px;
}

.card{
background:rgba(255,255,255,.08);
backdrop-filter:blur(20px);
padding:20px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,.2);
}

.valor{
font-size:28px;
font-weight:bold;
margin-top:10px;
}

.form-box{
background:rgba(255,255,255,.08);
padding:20px;
border-radius:20px;
margin-bottom:20px;
}

input, select{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
}

.btn{
padding:12px 20px;
border:none;
border-radius:10px;
margin-top:10px;
background:#3b82f6;
color:white;
cursor:pointer;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:12px;
border-bottom:1px solid rgba(255,255,255,.1);
text-align:left;
}

.progress{
height:20px;
background:#334155;
border-radius:20px;
overflow:hidden;
}

.progress-bar{
height:100%;
width:0%;
background:linear-gradient(90deg,#22c55e,#3b82f6);
transition:1s;
}

.theme{
position:fixed;
top:15px;
right:15px;
}

.light{
background:#f3f4f6;
color:#111;
}

.light .card,
.light .form-box{
background:white;
}

.light .sidebar{
background:#ffffff;
}

.light .menu button{
background:#e5e7eb;
color:#111;
}
</style>
</head>

<body>

<button class="btn theme" onclick="toggleTheme()">🌙 Tema</button>

<div class="container">

<div class="sidebar">

<div class="logo">
🚗 Controle de Ganhos<br>
Para Motorista de Aplicativo
</div>

<div class="menu">
<button onclick="abrirTela('dashboard')">📊 Dashboard</button>
<button onclick="abrirTela('lancamentos')">✍️ Lançamentos</button>
<button onclick="abrirTela('historico')">📋 Histórico</button>
</div>

</div>

<div class="content">

<!-- DASHBOARD -->
<div id="dashboard" class="page active">

<h2>📊 Dashboard</h2>

<div class="cards">

<div class="card">
Ganhos
<div class="valor" id="ganhos">R$ 0,00</div>
</div>

<div class="card">
Gastos
<div class="valor" id="gastos">R$ 0,00</div>
</div>

<div class="card">
Lucro
<div class="valor" id="lucro">R$ 0,00</div>
</div>

<div class="card">
🎯 Meta diária
<div style="margin-top:10px" class="progress">
<div class="progress-bar" id="metaBar"></div>
</div>
</div>

</div>

<div class="card">
<canvas id="grafico"></canvas>
</div>

</div>

<!-- LANÇAMENTOS -->
<div id="lancamentos" class="page">

<h2>✍️ Lançamentos</h2>

<div class="form-box">

<h3>💰 Ganho</h3>

<input type="number" id="valorGanho" placeholder="Valor">

<select id="plataforma">
<option>Uber</option>
<option>99</option>
<option>InDrive</option>
</select>

<button class="btn" onclick="salvarGanho()">
Salvar Ganho
</button>

</div>

<div class="form-box">

<h3>💸 Gasto</h3>

<input type="number" id="valorGasto" placeholder="Valor">

<button class="btn" onclick="salvarGasto()">
Salvar Gasto
</button>

</div>

</div>

<!-- HISTÓRICO -->
<div id="historico" class="page">

<h2>📋 Histórico</h2>

<div class="card">

<table>
<thead>
<tr>
<th>Data</th>
<th>Tipo</th>
<th>Valor</th>
<th>Plataforma</th>
</tr>
</thead>

<tbody id="historicoTabela"></tbody>

</table>

</div>

</div>

</div>

</div>
